  Introduction : 'Attacks with BigGAN.'
  
  optim : 'joint'    #optim method, ['GAN_based', 'GAN_free']
  img_lr : 0.03
  txt_lr : 0.1
  img_recon_method : 'GAN_based'   #['GAN_free', 'GAN_based']
  txt_recon_method : 'GAN_free'   #['GAN_free', 'GAN_based']
  img_indices : 'fedcola_img_block_img_emb'  # 'fedcola_img_block_img_emb', 'fedcola_img_block', 'def'
  txt_indices : 'fedcola_txt_block_txt_emb'  # 'fedcola_txt_block_txt_emb', 'fedcola_txt_block', 'def'
  img_max_iterations : 10
  txt_max_iterations : 30000
  img_convergence_threshold : 0.5
  txt_convergence_threshold : 0.5
  
  cost_fn : 'sim_cmpr0'   # the type of loss function for gradient inversion attacks.
  set_seed : 123       # random seed. Following GGL, we set 123 as seed for BigGAN(ImageNet).
  indices : 'def'      # decide which part of gradients to be involved in the final gradients match loss.
  weights : 'equal'    # weight of every graident scalar's matching loss
  init : 'randn'     # how we initial the original latent code.
  init_text : 'randn'     # how we initial the original latent code of text embedding.
  model : 'FedCola_IMG_TXT'   #FL model ['FedCola_IMG', 'FedCola_TXT', 'FedCola_IMG_TXT']
  restarts : 4
  init_ys: 'optim' # [label, rand, optim]  # how to initialize the class probabilities ys for BigGAN

  num_images : 1   # the number of images to reconstruct at a batch
  num_exp : 10     # the number of experiments / inverted images
  target_id : 10
  target_id_increment : 10 # the incrementation of target image id
  unrelated_target_offset : -1 # the offset for unrelated target
  lr : 0.03
  total_variation : 0.0001     #the coefficient of total variation
  bn_stat : 0       #choose if we use bn statistic to regularizer
  image_norm : 0.000001    #the coefficient of norm regularizer
  group_lazy : 0    #choose if we use group lazy regularization
  patch_prior: 0.00001   #the coefficient of patch prior regularizer
  CLIP_loss : -1 # 0.01    #the coefficient of CLIP loss regularizer
  CLIP_fused_loss : 0.01   #the coefficient of fused CLIP loss regularizer
  CLIP_confidence_loss : -1   #the coefficient of confidence-aware cross-modal regularizer
  CLIP_confidence_schedule : False  # enable dynamic lambda scheduling: False, 'global_avg', 'global_min', 'modality_specific'
  CLIP_confidence_alpha : 2.0  # trust hyperparameter for exponential decay (higher = faster transition to gradient-based)
  CLIP_conf_shed_decay : exponential  # decay type for confidence scheduling: 'exponential' or 'bell'
  CLIP_confidence_bell_k : 4.0  # scaling factor k for bell curve decay
  CLIP_confidence_temp : 1.0  # temperature for softmax normalization of confidence weights
  CLIP_convergence_threshold : 0.5  # the convergence threshold for CLIP loss

  max_iterations : 2000   #Maximum number of iterations for latent reconstruction.
  
  use_saved_models : False  # whether to use saved models or not
  model_load_dir : '/home/ubuntu/mnt-disk/results/fedcola/exp_name'  # the directory to load saved models from
  save_model : False  # whether to save the model or not
  skip_model_training : True  # whether to skip model training

  save_intermediate_at_img : 2000  # the interval at which to save intermediate results, -1 for no intermediate saving
  save_intermediate_at_txt : 100  # the interval at which to save intermediate results, -1 for no intermediate saving
  stop_at_text_perf_match : False  # whether to stop optimization when text is perfectly matched

  #For GIAS
  gias_iterations : 8000  #Maximum number of gias iterations for reconstruction.
  gias_lr : 0.00001   #For biggan, we'd better choose smaller learning rate 
  
  # For input data
  generative_model : 'BigGAN'
  gen_dataset : 'ImageNet64'
  dataset : 'Coco'   # ['Coco', 'Coco_img', 'Coco_txt']     
  data_path : 'N/A'  # specify your dataset path

  #For output data
  exp_name : 'ex1_joint_biggan_fedcola_coco_img_txt'   #Same latent space search
  output_dir : '/home/ubuntu/mnt-disk/results/censor-fedcola'
  #params for algorithm choice
